# 本地/CI 开发库连接串。
# allowPublicKeyRetrieval：MySQL 8 默认用 caching_sha2_password，首次连接需向服务端索取
# 公钥；useSSL=false 时不显式打开就会报 "Public Key Retrieval is not allowed"。
# 本地 Docker 因为缓存过公钥不报，CI 每次都是全新实例，所以只在 CI 暴露。
# 注意：这是开发库的取法，生产环境应该改走 SSL，而不是常开这个开关。
db.url=jdbc:mysql://localhost:3306/vCampus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
db.user=root
db.password=root