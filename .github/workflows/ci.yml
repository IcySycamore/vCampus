name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 状态检查 1：编译 + 测试JDK 8 工具链 -> Java 7 字节码，see ADR-0001
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vCampus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      # 建库脚本sql/vCampus.sql建出全部 25 张表。
      # 不需要 --force：脚本不再靠「报错并忽略」兜底，任何报错都该让 CI 红。
      # 建完立刻核对表数量：脚本悄悄少建几张表时，故障会以「表不存在」的形式出现在
      # 很远的模块里，不先在这里拦住就很难定位到根因。
      - name: Init test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < sql/vCampus.sql
          tables=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='vCampus';")
          echo "vCampus 表数量: $tables"
          test "$tables" -eq 25
      # 引用数据不在建库脚本里（sql/vCampus.sql 只建结构）：学院、教室、课表是「结构之外、
      # 系统运行又必须有」的行。开发库缺了它，新建学生/教师档案就会撞 1452 外键。
      - name: Load reference data
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot --default-character-set=utf8mb4 \
            < sql/vCampus-data.sql
      # Swing 界面测试（如 ServerConfigDialogTest）会真的 new JDialog，Ubuntu runner 无 X11
      # 显示，直接跑会抛 HeadlessException；用 Xvfb 起虚拟显示即可，-a 自动挑空闲 display。
      - name: Build and test (JDK 8)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: vCampus
        run: xvfb-run -a mvn -B -ntp clean verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"

  # 状态检查 2：注释 / 编码规范
  checkstyle:
    name: checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Checkstyle (Javadoc and coding standards)
        run: mvn -B -ntp checkstyle:check

  # 状态检查 3：完整性 see ADR-0004
  completeness:
    name: completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR completeness check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_pr_completeness.py
