version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vcampus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vCampus
      MYSQL_USER: vcampus
      MYSQL_PASSWORD: vcampus123
    ports:
      - "3306:3306"
    volumes:
      - ./sql/vCampus.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql-data:
