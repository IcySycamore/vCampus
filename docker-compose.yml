services:
  mysql:
    image: mysql:8.0
    container_name: vcampus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vCampus
      MYSQL_USER: vcampus
      MYSQL_PASSWORD: vcampus123
    ports:
      - "3306:3306"
    volumes:
      # 初始化脚本按文件名顺序执行：01 建库建表，02 打扩展补丁（补列 + 新增业务表 + 商店种子）
      - ./sql/vCampus.sql:/docker-entrypoint-initdb.d/01-vCampus.sql
      - ./sql/vCampus-extend.sql:/docker-entrypoint-initdb.d/02-vCampus-extend.sql
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql-data:
